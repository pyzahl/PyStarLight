# PyStarLight configuration
#
# Create your private copy with:   pystarlight-config init
# It is written to ~/.config/pystarlight/config.toml (only you can read it) and is never
# part of the git repository. Edit that copy, not this template.
#
# Lookup order: $PYSTARLIGHT_CONFIG, ./pystarlight.toml (project-local, git-ignored),
# ~/.config/pystarlight/config.toml. Anything left out falls back to this template.

# PySyzygos' sites.py (read as data): only the station dialog's first-time defaults, and its
# folder is where the local Gaia catalogue is found. Recordings carry their own station data
# ([observer] below); videos without their optics use [fallback_equipment].
pysyzygos_sites = ""       # e.g. "~/SVN/PySyzygos/sites.py"
default_site = ""          # its site id; $PYSYZYGOS_SITE also works (as in PySyzygos)

[observer]
# Station and equipment: the capture writes them into every recording (RAVF header, SER
# sidecar .ser.meta.json), and the viewer passes them on in <movie>.event.json
# (recording.station) for the occultation report (PySyzygos' observation GUI). The camera
# edits them in its "Station & equipment" dialog and records only when the required ones
# (name, station, telescope, telescope_type, aperture_mm, focal_length_mm, mount,
# observing_method; without GPS also latitude / longitude) are set. --observer / --telescope
# on its command line override name and telescope. Only the first time (nothing set here yet)
# the dialog suggests values from the PySyzygos default site below; after Save, this table alone.
name = ""                  # observer 1 (responsible for this station)
email = ""
observer2 = ""             # further operators of this station
more_observers = ""
station = ""               # station name, e.g. "Sternwarte Seewis Dorf (SWD)"
telescope = ""             # description, e.g. "C-14 EHD"
telescope_type = ""        # IOTA-ES form: Refractor, Newtonian, SCT, Dobsonian, Binoculars, Other, None, Electronic
aperture_mm = 0.0          # mm (earlier versions: aperture_cm, read and converted)
focal_length_mm = 0.0      # EFFECTIVE focal length in mm, with the reducer / Barlow (e.g. 750 x 0.5 = 375)
focal_reducer = ""         # e.g. "0.4x" ("" = none)
mount = ""
camera = ""
observing_method = "a"     # IOTA-ES code: a video, d sequential images, ...
camera_delay_s = 0.0       # known timing offset of the camera (0 = none known) ...
camera_delay_applied = false   # ... and whether the time stamps already contain it
# Fallback site (decimal degrees, metres above mean sea level): only used when the GPS has
# no fix, and then marked SITE-SOURCE = "config" in the recording. 0 / 0 = no fallback.
latitude = 0.0
longitude = 0.0
altitude = 0.0

[fallback_equipment]
# FALLBACK EQUIPMENT for videos that do not carry their optics: ADV / AVI / SER from other
# programs, a SER whose .ser.meta.json was left behind, recordings of older captures. Only for
# the viewer's plate-scale hint, with a WARNING each time it is used. PyStarLight's own
# recordings carry the station's effective focal length and sensor ([observer]) and never use it.
focal_length_mm = 0.0      # EFFECTIVE focal length (with reducer / Barlow); 0 = not set
pixel_um = 0.0             # sensor pixel pitch; 0 = from the recording's sensor name, if known
binning = 1

[astrometry]
# Personal API key from https://nova.astrometry.net (My Profile). Keep it private.
api_key = ""
url = "https://nova.astrometry.net/api/"
# "auto": a local astrometry.net (solve-field + index files) when installed, else nova
# (needs api_key); "local" or "nova" to force one. Local is offline and needs index files
# covering quads of ~10-100 % of the field width (apt: astrometry-data-2mass-*)
solver = "auto"
timeout_s = 900
auto_solve = true          # on open: load the cached solution (<movie>.wcs.fit), or solve offline
                           # (local solver); uploads to nova only with key p
stack_frames = 16          # frames median-stacked for the solve (more stars, no cosmic rays)
scale_err_pct = 20         # tolerance on the plate scale from the recording (or fallback) optics
scale_hint = true          # send a plate-scale hint (recording or fallback optics, or scale_arcsec); false = blind
scale_arcsec = 0.0         # override the plate scale, arcsec/px (0 = from the recording or fallback optics)
center_hint = true         # send the recording's own RA/Dec (ADV metadata) as the field centre
public = false             # let astrometry.net show the image publicly

[paths]
# Where recordings live; the viewer starts here.
data_dir = ""

[calibration]
# Optional dark / flat ("bright") clips, any movie format. Relative paths are relative to this
# file's folder. Each is averaged (stacked) into a
# master frame, cached in ~/.cache/pystarlight (re-stacked when the clip changes), and applied
# to the aperture boxes. Record them with the same gain and exposure as the observation.
use_calibration = true     # false: keep the entries below but do not apply them
dark = ""                  # telescope covered
flat = ""                  # evenly lit field (twilight sky / light panel), not saturated
flat_dark = ""             # dark at the flat's exposure, if that differs ("" = use dark)
frames = 0                 # frames to stack from each clip; 0 = all
method = "mean"            # "mean" (as PyMovie) or "median" (ignores cosmic rays / satellites)
file = ""                  # or a prebuilt .npz from Calibration.save() (used if no clips are set)

[apertures]
size = 51                  # box size, px (search window and local background)

# Aperture types. Names are <name><n> (n counts from 1; a role with max = 1 gets just <name>).
# key: viewer key that gives the aperture under the mouse this role. Avoid f (full screen),
#      o (zoom), q (quit), and the viewer's own keys (arrows, n a s l p, shift Y R G W).
# track: the star steers the global tracking.  normalize: used as a reference in normalisation.
[apertures.roles.target]
name = "target"
color = "red"
key = "t"
max = 1
track = true
normalize = false

[apertures.roles.reference]
name = "ref"
color = "yellow"
key = "r"
max = 0                    # 0 = no limit
track = true
normalize = true

[apertures.roles.check]
# comparison star measured like the target but kept out of normalisation (validates the references)
name = "check"
color = "green"
key = "c"
max = 0
track = true
normalize = false

[apertures.roles.sky]
# star-free region; global background when analysis.background = "sky"
name = "sky"
color = "cyan"
key = "k"
max = 0
track = false
normalize = false

[analysis]
mode = "global"            # "global" (all stars track together, peak fits) or "pymovie" (exact PyMovie)
radius = 0.0               # photometry radius, px; 0 = radius_fwhm x median FWHM (follows the seeing)
radius_fwhm = 1.5          # auto radius in FWHM: 1.5 keeps nearly all light; ~0.85 best SNR for faint,
                           # sky-limited targets (LF35 C-14 test: scatter 23% -> 19%)
background = "local"       # "local" box per aperture, or "sky" from sky apertures
search = 15                # px around the predicted position to look for each star
rotation = true            # fit field rotation as well as shift
min_snr = 5.0              # minimum peak SNR for a star to steer tracking
dim_fraction = 0.4         # target left out of tracking when fading below this (relative to others)
target_drift = true        # follow the target's own slow offset, interpolated across the event
normalize_window = 31      # rows; smoothing of the reference sum
photometry = "optimal"     # "optimal": Naylor's optimal extraction, pixels weighted by a circular
                           # Gaussian of the frame's seeing at the tracked position, the same profile for
                           # all stars (viewer checkbox "Optimal"); "aperture": the circle (radius above)
optimal_radius_fwhm = 3.0  # optimal: weights out to this many FWHM
seeing_frames = 5          # optimal: running median of the reference stars' FWHM over these frames

[pymovie]
# Used when analysis.mode = "pymovie"
default_mask_radius = 3.2
threshold = 99999          # 99999 = always the default circular mask

[display]
# Viewer image display only (photometry is never affected).
levels = "auto"            # "auto" (zscale stretch) or [black, white] in counts, e.g. [3700, 4600]
per_frame = false          # recompute auto levels on every frame (clouds, changing sky)
gamma = 1.0                # display gamma: < 1 brightens faint stars, > 1 darkens the background
star_names = true          # star names (catalogue identification) on the image; N or the Names button

[catalog]
# Star names offline: PySyzygos' local Gaia DR3 catalogue (format 2; with its xref part the
# Tycho-2 / UCAC4 names). Empty: $PYSYZYGOS_CATALOG, else found next to pysyzygos_sites.
# SIMBAD (online) is asked only for stars the local catalogue does not have.
gaia_dir = ""

[camera]
# The camera's Favorites button: the recording window around the predicted event time.
record_before_s = 30.0     # start this long before the event ...
record_after_s = 30.0      # ... and stop this long after it

[pysyzygos_server]
# The camera's Favorites button: tonight's events from a PySyzygos server (its SERVER_MODE.md,
# favorites API). url e.g. "http://home:8080"; token from 'pysyzygos gui --new-token PyStarLight'
# (not needed for a local-mode PySyzygos on 127.0.0.1). Also: --pysyzygos URL, $PYSYZYGOS_TOKEN.
url = ""
token = ""
past_hours = 0             # also list events up to this many hours ago (tests: record a recent one now)

[pysyzygos_observations]
# The viewer's "Send" (key e): <movie>.event.json to PySyzygos' observation GUI, which opens the
# report of the matching favorite (its docs/observation_interface.md). On the computer that runs
# PySyzygos nothing needs setting: its observation GUI writes a connection file at every start
# (~/.config/pysyzygos/observation_api.json: url, token, inbox), and when it is not running the
# file is copied into its inbox. Only for a PySyzygos on another computer (rare; there:
# 'pysyzygos gui-observation --host 0.0.0.0'): url and token below override that file.
# Also: $PYSYZYGOS_OBS_URL, $PYSYZYGOS_OBS_TOKEN. Not reached: queued in ~/.cache/pystarlight/outbox.
url = ""                   # e.g. "http://home:8088"
token = ""                 # there: pysyzygos gui --new-token PyStarLight
inbox = ""                 # override the connection file's inbox folder ("" = from the file)
auto_send = false          # hand over after every Run

[output]
# Stacked field image after each run: all analysed frames shifted/rotated back by the tracking
# solution and averaged. Saved as <movie>-stack.fits (with the plate solution) and annotated
# figures (apertures, names, catalogue IDs, compass, scale bar) in the formats below.
stack_image = true
stack_max_frames = 300     # evenly spaced subset for long runs (0 = all)
stack_formats = ["svg", "png", "pdf"]

[plot]
formats = ["pdf", "png"]
dpi = 300
bin_size = 1
